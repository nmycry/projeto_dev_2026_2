<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block titulo %}Alambique Sertão{% endblock %}</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
    @theme {
      --color-grafite: #0E1113;
      --color-aco:     #171B1E;
      --color-vapor:   #E6E7E4;
      --color-nevoa:   #78848A;
      --color-cobre:   #C87A3F;
      --color-filete:  #232A2E;

      --font-corpo: Archivo, system-ui, sans-serif;
      --font-mono:  "JetBrains Mono", ui-monospace, monospace;

      --radius-maquina: 2px;
    }
    /* largura expandida do Archivo para títulos */
    .titulo { font-family: var(--font-corpo); font-variation-settings: "wdth" 118; letter-spacing: -0.02em; }
    /* dígitos tabulares em toda medida */
    .medida { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  </style>

  <style>
    @media (prefers-reduced-motion: no-preference) {
      .destaque-status {
        animation: destaque-status 600ms ease-out;
      }
    }
    @keyframes destaque-status {
      from { outline: 1px solid var(--color-cobre); }
      to { outline: 1px solid transparent; }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2"></script>
  <script>
    document.addEventListener('htmx:afterSwap', (evento) => {
      if (evento.detail.target.matches('tr[id^="linha-visita-"]')) {
        evento.detail.target.classList.add('destaque-status');
      }
    });
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body class="bg-grafite text-vapor font-corpo" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <header class="flex items-center justify-between px-6 py-4 border-b border-filete">
    <a href="{% url 'visitas:home' %}" class="font-medium tracking-tight">Alambique Sertão</a>
    <nav>
      <a href="{% url 'visitas:painel_home' %}" class="text-sm hover:text-cobre">Painel</a>
    </nav>
  </header>

  <main>
    {% block conteudo %}{% endblock %}
  </main>

  <footer class="px-6 py-8 text-sm text-nevoa border-t border-filete">
    Alambique Sertão &middot; Salinas, MG
  </footer>
</body>
</html>
