{% if visita.status == 'PENDENTE' %}
  <span class="inline-block rounded-maquina border px-3 py-1 bg-aco border-[#E0A24E] text-[#E0A24E]">pendente</span>
{% elif visita.status == 'CONFIRMADA' %}
  <span class="inline-block rounded-maquina border px-3 py-1 bg-aco border-[#7FC9A0] text-[#7FC9A0]">confirmada</span>
{% else %}
  <span class="inline-block rounded-maquina border px-3 py-1 bg-aco border-[#D9705F] text-[#D9705F]">cancelada</span>
{% endif %}
