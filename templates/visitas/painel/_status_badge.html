{% if visita.status == 'PENDENTE' %}
  <span class="inline-block rounded-full px-3 py-1 bg-[#F0E4CE] text-[#7A5518]">pendente</span>
{% elif visita.status == 'CONFIRMADA' %}
  <span class="inline-block rounded-full px-3 py-1 bg-[#DDE5CE] text-[#3F5426]">confirmada</span>
{% else %}
  <span class="inline-block rounded-full px-3 py-1 bg-[#EFDAD5] text-[#8A3B2A]">cancelada</span>
{% endif %}
