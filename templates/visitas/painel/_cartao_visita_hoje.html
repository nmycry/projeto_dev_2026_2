<div
  id="cartao-visita-{{ visita.pk }}"
  class="border-b border-filete py-4"
>
  <div class="min-w-0">
    <p class="text-[18px]">{{ visita.nome }}</p>
    <p class="mt-1 text-[14px] text-nevoa">
      <span class="medida">{{ visita.num_pessoas }}</span> pessoa{{ visita.num_pessoas|pluralize }}
      {% if visita.telefone %}
        &middot; <a href="tel:{{ visita.telefone }}" class="hover:text-cobre underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cobre">{{ visita.telefone }}</a>
      {% endif %}
    </p>
  </div>

  {% if visita.observacoes %}
    <p class="mt-3 border-l-2 border-cobre pl-3 text-[14px]">{{ visita.observacoes }}</p>
  {% endif %}

  <div class="mt-4 grid grid-cols-2 gap-3">
    <form
      method="post"
      action="{% url 'visitas:visita_marcar_presenca' visita.pk %}"
      hx-post="{% url 'visitas:visita_marcar_presenca' visita.pk %}"
      hx-target="#cartao-visita-{{ visita.pk }}"
      hx-swap="outerHTML"
    >
      {% csrf_token %}
      <input type="hidden" name="compareceu" value="presente">
      <button
        type="submit"
        class="w-full px-4 py-4 rounded-maquina border bg-aco text-[15px] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cobre {% if visita.compareceu == True %}border-[#7FC9A0] text-[#7FC9A0]{% else %}border-filete text-nevoa{% endif %}"
      >
        Presente
      </button>
    </form>
    <form
      method="post"
      action="{% url 'visitas:visita_marcar_presenca' visita.pk %}"
      hx-post="{% url 'visitas:visita_marcar_presenca' visita.pk %}"
      hx-target="#cartao-visita-{{ visita.pk }}"
      hx-swap="outerHTML"
    >
      {% csrf_token %}
      <input type="hidden" name="compareceu" value="ausente">
      <button
        type="submit"
        class="w-full px-4 py-4 rounded-maquina border bg-aco text-[15px] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-cobre {% if visita.compareceu == False %}border-[#D9705F] text-[#D9705F]{% else %}border-filete text-nevoa{% endif %}"
      >
        Não veio
      </button>
    </form>
  </div>
</div>
